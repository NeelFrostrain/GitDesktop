<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Git Desktop</title>

    <!-- Google Fonts: Inter & JetBrains Mono with non-blocking display=swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      />
    </noscript>

    <!-- Inline Critical Styles for Instant Minimalist Splash Screen -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #121113;
        color: #e6e4e8;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }

      #root {
        width: 100%;
        height: 100%;
      }

      .app-loader-container {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100vw;
        height: 100vh;
        background-color: #121113;
      }

      .app-loader-logo {
        width: 60px;
        height: 60px;
        object-fit: contain;
        animation: loader-pulse 1.8s ease-in-out infinite alternate;
      }

      @keyframes loader-pulse {
        0% {
          transform: scale(0.96);
          opacity: 0.75;
        }
        100% {
          transform: scale(1.03);
          opacity: 1;
        }
      }
    </style>

    <!-- Early theme preset detection -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('git-desktop-theme-preset') || 'commito-dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (_) {}
      })();
    </script>
  </head>

  <body>
    <div id="root">
      <!-- Minimalist Icon Loading Screen (Replaced automatically when React mounts) -->
      <div class="app-loader-container">
        <img src="/app-icon.png" alt="Git Desktop" class="app-loader-logo" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
